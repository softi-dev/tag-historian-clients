# Validation for every Python package in this repository: the Home Assistant
# integration at the root (hassfest + HACS structure + its test suite, which
# also holds the published Grafana dashboard to its shape), and the
# python-client/, mcp-server/ and influxdb-migration/ packages (each package's
# own pytest and ruff, on that package's own Python floor).
#
# collector/ is deliberately absent: it is documentation for the collector
# container image, whose source and build live in the private product
# repository. There is nothing here to lint or test.
#
# This file was written inside the Tag Historian product repository, staged
# for exactly this split - it landed at this root when the clients moved to
# their own repository, and started running then.
name: Validate

on:
  push:
  pull_request:
  # The nightly is the point of this file. Home Assistant ships a release every
  # month and deprecates API surface on a schedule; a cron here finds the drift
  # before a user's log does.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Home Assistant manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Nothing is ignored, on purpose: the HACS default store accepts a
      # repository only when this action passes with no ignores at all, and
      # the PR to hacs/default links a run of it. The brands check is met by
      # custom_components/tag_historian/brand/icon.png - HACS looks there
      # before it falls back to home-assistant/brands, and since Home
      # Assistant 2026.3 a custom integration ships its images that way
      # rather than through a brands PR.
      - uses: hacs/action@main
        with:
          category: integration

  test:
    name: Home Assistant tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      # Scoped to the integration's own directories - python-client/ and
      # mcp-server/ run their own, stricter ruff in their own jobs below.
      - run: ruff check custom_components tests
        continue-on-error: true
      # No continue-on-error here: a test that cannot fail the build is a
      # test nobody fixes.
      - run: python -m pytest

  test-newest:
    # The same suite on the NEWEST Home Assistant the test package carries,
    # unpinned, beside the pin above. The pin is the floor hacs.json
    # promises; this is where a user who updates every month already is - and
    # where the recorder's statistics API moves (has_mean goes in 2026.11,
    # mean_type stays). Run nightly by the schedule, it finds the drift before
    # a user's log does.
    name: Home Assistant tests (newest)
    runs-on: ubuntu-latest
    # Unpinned, so a release that hangs the suite is possible; the nightly
    # should fail, not hold a runner for the default six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Newer Home Assistant releases need a newer Python than the pin
          # does; on an older one pip would quietly settle for an older
          # package, and this job would test the past.
          python-version: "3.14"
      - run: pip install pytest-homeassistant-custom-component
      - run: pip freeze | grep -i -E "^(homeassistant|pytest-homeassistant-custom-component)=="
      - run: python -m pytest

  python-client:
    name: Python client (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The package's declared floor and the newest release: the floor is
        # where a hobbyist's older Raspberry Pi actually is, and the two ends
        # of the range catch more than any version in the middle would.
        python-version: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: python-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python-client/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest

  mcp-server:
    name: MCP server (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 is this package's own floor (FastMCP introspects PEP 604
        # unions at runtime - see mcp-server/pyproject.toml), 3.13 the
        # newest release.
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: mcp-server/pyproject.toml
      # Deliberately two installs: taghistorian is not on PyPI, and
      # mcp-server's pyproject does not declare it (see the TODO there), so
      # the sibling checkout is the dependency.
      - run: pip install -e ../python-client
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest

  influxdb-migration:
    name: InfluxDB migration (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The package's declared floor and the newest release, as for
        # python-client: the copy runs once, on whatever machine can reach the
        # InfluxDB - often an old Raspberry Pi or a NAS.
        python-version: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: influxdb-migration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: influxdb-migration/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest
