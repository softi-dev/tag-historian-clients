# Validation for all three packages in this repository: the Home Assistant
# integration at the root (hassfest + HACS structure + its test suite), and
# the python-client/ and mcp-server/ packages (each package's own pytest and
# ruff, on that package's own Python floor).
#
# This file was written inside the Tag Historian product repository, staged
# for exactly this split - it landed at this root when the clients moved to
# their own repository, and started running then.
name: Validate

on:
  push:
  pull_request:
  # The nightly is the point of this file. Home Assistant ships a release every
  # month and deprecates API surface on a schedule; a cron here finds the drift
  # before a user's log does.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Home Assistant manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Until a brand exists at home-assistant/brands (or a brand/ folder
          # is added here), the brands check has nothing to find. Ignoring it
          # keeps the rest of the validation meaningful instead of permanently
          # red; remove this line once the brands PR lands.
          ignore: brands

  test:
    name: Home Assistant tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      # Scoped to the integration's own directories - python-client/ and
      # mcp-server/ run their own, stricter ruff in their own jobs below.
      - run: ruff check custom_components tests
        continue-on-error: true
      # No continue-on-error here: a test that cannot fail the build is a
      # test nobody fixes.
      - run: python -m pytest

  python-client:
    name: Python client (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The package's declared floor and the newest release: the floor is
        # where a hobbyist's older Raspberry Pi actually is, and the two ends
        # of the range catch more than any version in the middle would.
        python-version: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: python-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python-client/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest

  mcp-server:
    name: MCP server (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 is this package's own floor (FastMCP introspects PEP 604
        # unions at runtime - see mcp-server/pyproject.toml), 3.13 the
        # newest release.
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: mcp-server/pyproject.toml
      # Deliberately two installs: taghistorian is not on PyPI, and
      # mcp-server's pyproject does not declare it (see the TODO there), so
      # the sibling checkout is the dependency.
      - run: pip install -e ../python-client
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest
